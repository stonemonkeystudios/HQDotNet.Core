name: .NET (Compatibility Wrapper)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  pr-validation:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-validation.yml

  dev-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/dev-build.yml
